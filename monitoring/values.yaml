# kube-prometheus-stack configuration

defaultRules:
  create: true

prometheus:
  enabled: true

  prometheusSpec:
    retention: 5d
    retentionSize: "2GB"

    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 768Mi

grafana:
  enabled: true

  adminPassword: "admin123"

  persistence:
    enabled: false

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 768Mi

alertmanager:
  enabled: true

  alertmanagerSpec:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi

prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 100Mi
    limits:
      cpu: 300m
      memory: 200Mi

nodeExporter:
  enabled: true

kubeStateMetrics:
  enabled: true