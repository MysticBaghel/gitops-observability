backend:
  replicas: 0
chunksCache:
  enabled: false
deploymentMode: SingleBinary
gateway:
  enabled: false
loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  image:
    tag: 3.6.18
  schemaConfig:
    configs:
    - from: "2024-04-01"
      index:
        period: 24h
        prefix: loki_index_
      object_store: filesystem
      schema: v13
      store: tsdb
  storage:
    type: filesystem
lokiCanary:
  enabled: false
minio:
  enabled: false
read:
  replicas: 0
resultsCache:
  enabled: false
singleBinary:
  persistence:
    enabled: true
    size: 5Gi
    storageClass: standard
  replicas: 1
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 512Mi
test:
  enabled: false
write:
  replicas: 0
